name: Publication Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'detasar/llm-weight-editing-study'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: node --test web/tests/delivery.test.mjs
      - run: npm --prefix web run build
        env:
          PAGES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this publication
        id: deployment
        uses: actions/deploy-pages@v4
