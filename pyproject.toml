[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-editing-study"
version = "1.0.0"
description = "Verified numeric publication snapshot of language-model-guided weight editing"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.9.1"]

[project.optional-dependencies]
native = ["torch==2.15.0", "safetensors==0.8.0", "jsonschema==4.26.0"]
lm = ["transformers==5.22.1", "datasets==5.1.0", "accelerate==1.15.0", "lm_eval @ git+https://github.com/EleutherAI/lm-evaluation-harness.git@d6de81643928d653435c431bae19945d41d32520"]
test = ["pytest==9.2.0"]

[project.scripts]
ws-lab-reproduce = "ws_lab.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ws_lab = ["resources/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
